name: Update Google Scholar stats (monthly)

# There's no official Google Scholar API, so this scrapes the public
# profile page via the `scholarly` library on a low, once-a-month
# frequency to avoid getting blocked. See scripts/update_scholar_stats.py
# for the safe-fail logic: a blocked/failed run leaves the existing
# data/scholar-stats.json untouched rather than overwriting it with zeros.
on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-scholar-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest citation metrics
        run: python3 scripts/update_scholar_stats.py

      - name: Commit data/scholar-stats.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar-stats.json
          if git diff --cached --quiet; then
            echo "No change (fetch may have been skipped, or nothing changed) — nothing to commit."
          else
            git commit -m "chore: update Google Scholar citation stats [skip ci]"
            git push
          fi
