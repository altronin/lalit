name: Regenerate RSS feed

# Runs automatically whenever blog data changes on the main branch,
# and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "data/blogs.json"
      - "scripts/generate_feed.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate feed.xml
        run: python3 scripts/generate_feed.py

      - name: Commit feed.xml if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "feed.xml is already up to date — nothing to commit."
          else
            git commit -m "chore: regenerate feed.xml [skip ci]"
            git push
          fi
