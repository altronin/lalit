	<link rel="alternate" type="application/rss+xml" title="Lalit Pathak - Environmental Insights" href="https://lalitpathak.com.np/feed.xml">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/site.css">
	<script>(function(){try{if(localStorage.getItem('lp-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
	<style>
		.blog-content-container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 3rem; border-radius: var(--border-radius); box-shadow: var(--box-shadow); }
		.blog-hero-image { width: 100%; max-height: 420px; object-fit: cover; border-radius: var(--border-radius); margin-bottom: 2rem; }
		.blog-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--light-gray); }
		.blog-meta-left { display: flex; align-items: center; gap: 0.8rem; color: var(--gray-color); font-size: 0.95rem; }
		.blog-category { background: var(--primary-color); color: white; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.9rem; font-weight: 600; }

		.blog-article h2 { color: var(--primary-color); margin-top: 2.5rem; }
		.blog-article h3 { color: var(--secondary-color); margin-top: 2rem; }
		.blog-article ul, .blog-article ol { margin: 1.5rem 0; padding-left: 2rem; }
		.blog-article li { margin-bottom: 0.8rem; line-height: 1.6; }
		.blog-article blockquote { border-left: 4px solid var(--primary-color); padding-left: 1.5rem; margin: 2rem 0; font-style: italic; color: var(--gray-color); }
		.blog-article a { color: var(--primary-color); font-weight: 600; text-decoration: underline; }
		.blog-article a:hover { color: var(--primary-dark); }
		.blog-article img { max-width: 100%; height: auto; border-radius: var(--border-radius); margin: 1.5rem 0; }

		.post-footer { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 2px solid var(--light-gray); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
		.back-link { font-weight: 600; }
		.share-links { display: flex; gap: 0.6rem; }
		.share-links a { width: 38px; height: 38px; border-radius: 50%; background: var(--light-color); color: var(--primary-color); display: flex; align-items: center; justify-content: center; }
		.share-links a:hover { background: var(--primary-color); color: #fff; }

		.not-found { text-align: center; padding: 3rem 0; color: var(--gray-color); }

		@media (max-width: 768px) { .blog-content-container { padding: 1.5rem; } }
	</style>
</head>
<body>
	<a href="#main" class="skip-link">Skip to content</a>
	<nav id="nav">
		<div class="container nav-container">
			<a href="index.html" class="nav-logo">Lalit Pathak</a>
			<div class="nav-right">
				<ul class="nav-menu">
					<li><a href="index.html">Home</a></li>
					<li><a href="myskills.html">My Skills</a></li>
					<li><a href="portfolio.html">Portfolio</a></li>
					<li><a class="active" href="blogs.html">Blog</a></li>
					<li><a href="contact.html">Contact</a></li>
				</ul>
				<button class="theme-toggle" type="button" aria-label="Switch to dark mode">
					<i class="fas fa-moon" aria-hidden="true"></i>
					<i class="fas fa-sun" aria-hidden="true"></i>
				</button>
				<a class="menu_trigger" href="#"><i class="fas fa-bars"></i></a>
			</div>
		</div>
	</nav>

	<header id="header">
		<div class="container header-content">
			<h1 class="page-title" id="post-title">Loading&hellip;</h1>
			<p class="page-subtitle" id="post-excerpt"></p>
		</div>
	</header>

	<div class="container">
		<main id="main">
			<div class="blog-content-container" id="post-container">
				<!-- Filled in by script below once data/blogs.json loads -->
			</div>
		</main>
	</div>

	<footer id="footer">
		<div class="container">
			<div class="footer-content">
				<ul class="social">
					<li><a href="mailto:mail@lalitpathak.com.np" aria-label="Email"><i class="fas fa-envelope"></i></a></li>
					<li><a href="https://www.linkedin.com/in/altronin/" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a></li>
					<li><a href="https://www.researchgate.net/profile/Lalit-Pathak-3?ev=hdr_xprf" aria-label="ResearchGate"><i class="fab fa-researchgate"></i></a></li>
					<li><a href="https://x.com/Alt_Ronin" aria-label="Twitter"><i class="fab fa-twitter"></i></a></li>
					<li><a href="https://scholar.google.com/citations?user=g2ElSJYAAAAJ&hl=en" aria-label="Google Scholar"><i class="fas fa-graduation-cap"></i></a></li>
				</ul>
				<div class="footer-links">
					<a href="index.html">Home</a>
					<a href="myskills.html">My Skills</a>
					<a href="portfolio.html">Portfolio</a>
					<a href="blogs.html">Blog</a>
					<a href="contact.html">Contact</a>
				</div>
				<p class="copy">&copy; <span id="current-year">2026</span> Lalit Pathak. All rights reserved.</p>
			</div>
		</div>
	</footer>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
	<script src="js/site.js"></script>
	<script>
		// ---------- Load the post named in the URL, e.g. blog-post.html?post=my-slug ----------
		const params = new URLSearchParams(window.location.search);
		const slug = params.get('post');
		const pageUrl = 'https://lalitpathak.com.np/blog-post.html?post=' + encodeURIComponent(slug || '');

		fetch('data/blogs.json')
			.then(res => res.json())
			.then(data => {
				const post = (data.items || []).find(item => item.slug === slug);
				const container = document.getElementById('post-container');

				if (!post) {
					document.getElementById('post-title').textContent = 'Post not found';
					container.innerHTML = '<p class="not-found">Sorry, this post could not be found. <a href="blogs.html">Back to Blog</a></p>';
					return;
				}

				document.title = post.title + ' | Lalit Pathak - Environmental Scientist';
				document.getElementById('page-description-tag').setAttribute('content', post.excerpt || post.title);
				document.getElementById('og-title-tag').setAttribute('content', post.title);
				document.getElementById('post-title').textContent = post.title;
				document.getElementById('post-excerpt').textContent = post.excerpt || '';

				const heroImage = post.image
					? `<img src="${escapeHTML(post.image)}" alt="${escapeHTML(post.title)}" class="blog-hero-image">`
					: '';

				const bodyHTML = post.body ? marked.parse(post.body) : '<p>' + escapeHTML(post.excerpt || '') + '</p>';
				const wordCount = (post.body || post.excerpt || '').split(/\s+/).filter(Boolean).length;
				const readingMinutes = Math.max(1, Math.round(wordCount / 200));

				container.innerHTML = `
					${heroImage}
					<div class="blog-meta">
						<div class="blog-meta-left">
							<span>${escapeHTML(post.date)}</span>
							<span>&middot;</span>
							<span>${readingMinutes} min read</span>
						</div>
						<span class="blog-category">${escapeHTML(post.category || '')}</span>
					</div>
					<article class="blog-article">${bodyHTML}</article>
					<div class="post-footer">
						<a href="blogs.html" class="back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to all posts</a>
						<div class="share-links">
							<a href="https://twitter.com/intent/tweet?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(post.title)}" target="_blank" rel="noopener" aria-label="Share on Twitter / X"><i class="fab fa-twitter"></i></a>
							<a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener" aria-label="Share on LinkedIn"><i class="fab fa-linkedin-in"></i></a>
							<a href="mailto:?subject=${encodeURIComponent(post.title)}&body=${encodeURIComponent(pageUrl)}" aria-label="Share by Email"><i class="fas fa-envelope"></i></a>
						</div>
					</div>
				`;
			})
			.catch(err => {
				console.error('Could not load post', err);
				document.getElementById('post-title').textContent = 'Could not load post';
			});
	</script>
</body>
</html>
