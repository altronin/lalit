<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#3a6b52" />
    <title>Content Manager — Lalit Pathak</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <!-- Colours only. (A <link>, not a <style src>: <style> tags cannot load files.) -->
    <link rel="stylesheet" href="custom-admin.css" />
  </head>
  <body>
    <noscript><p style="padding:1rem">Please enable JavaScript to use the content manager.</p></noscript>

    <!-- Pinned to an exact version on purpose: custom-admin.css targets Decap's
         internal class names, which can change between releases. Test before bumping. -->
    <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>
    <!-- Adds the "Embed (video / PDF / slides)" button to every rich-text editor -->
    <script src="embed-component.js"></script>
    <!-- Help button and "saved" confirmation -->
    <script src="admin.js"></script>
  </body>
</html>
